<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Couronne Urban — Mobile</title>
<style>
:root{--bg:#FAF8F2;--card:#fff;--tx:#18202B;--mu:#6B7480;--or:#FF9100;--nv:#18202B;--ln:#E7E7E7;--ok:#1E7B4A;--ko:#B3261E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151C;--card:#1A222D;--tx:#F2EFE8;--mu:#9AA3AF;--ln:#2B3644}}
:root[data-theme="dark"]{--bg:#10151C;--card:#1A222D;--tx:#F2EFE8;--mu:#9AA3AF;--ln:#2B3644}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:15px Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
header{background:#18202B;color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}header img{width:42px;height:42px;border-radius:50%;background:#fff}
header b{font-size:16px;display:block}header small{color:var(--or);font-size:11px}
main{flex:1;overflow:auto;padding:12px 12px 90px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.k{background:var(--card);border-left:4px solid var(--or);border-radius:8px;padding:10px}
.k small{color:var(--mu);font-size:10px;font-weight:700;text-transform:uppercase}.k div{font-size:19px;font-weight:700;margin-top:4px}
.r{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin:8px 0;display:flex;gap:8px;align-items:center}
.r>div{flex:1;min-width:0}.r b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.r small{color:var(--mu)}
.p{height:6px;background:var(--ln);border-radius:3px;margin-top:6px}.p i{display:block;height:100%;background:var(--or);border-radius:3px}
.ok{color:var(--ok)}.ko{color:var(--ko)}h2{font-size:14px;margin:14px 0 4px;color:var(--mu);text-transform:uppercase}
nav{position:fixed;left:0;right:0;bottom:0;background:#18202B;display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:#B8BEC7;padding:9px 0 7px;font-size:10px}nav button span{display:block;font-size:19px}nav button.on{color:var(--or)}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--or);color:#fff;font-size:30px;box-shadow:0 3px 10px #0004}
#m{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end}#m.on{display:flex}
#f{background:var(--card);width:100%;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}input,select{width:100%;padding:11px;border:1px solid var(--ln);border-radius:8px;font-size:16px;background:var(--bg);color:var(--tx)}
.b{border:0;border-radius:8px;padding:12px;font-size:15px;font-weight:700;background:var(--or);color:#fff;width:100%;margin-top:14px}.x{background:none;border:0;color:var(--ko);font-size:18px;padding:6px}
a{color:var(--or);text-decoration:none}.em{text-align:center;color:var(--mu);padding:30px 10px}
</style></head><body>

<script>
const K='cu_mobile_v1';let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{clients:[],projets:[],paiements:[],depenses:[]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const O={Types:['Cuisine','Dressing','Salon marocain','Salon moderne','Tapisserie','Menuiserie','Décoration','Aménagement','Villa','Bureau','Restaurant','Hôtel','Autre'],
St:['Prospect','Devis','Validé','En préparation','En production','Installation','Livraison','Terminé','Annulé'],Modes:['Espèces','Virement','Chèque','Carte','Autre'],SP:['Reçu','Prévu','Annulé'],
Cat:['Bois','MDF','Tissu','Mousse','Peinture','Quincaillerie','Électricité','Transport','Main-d\'œuvre','Publicité','Loyer','Téléphone','Fournitures','Fournisseurs','Autre']};
const F={clients:[['nom','Nom','text'],['tel','Téléphone','tel'],['ville','Ville','text']],
projets:[['nom','Nom du projet','text'],['client','Client','sel:clients'],['type','Type','opt:Types'],['prix','Prix vendu (DH)','number'],['av','Avancement %','number'],['statut','Statut','opt:St']],
paiements:[['client','Client','sel:clients'],['projet','Projet','sel:projets'],['montant','Montant (DH)','number'],['mode','Mode','opt:Modes'],['statut','Statut','opt:SP']],
depenses:[['cat','Catégorie','opt:Cat'],['projet','Projet (optionnel)','sel:projets'],['montant','Montant (DH)','number'],['desc','Description','text']]};
const T=[['home','🏠','Accueil'],['clients','👥','Clients'],['projets','🛠','Projets'],['paiements','💰','Paiements'],['depenses','📉','Dépenses']];
let tab='home';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id),N=v=>+v||0,fm=v=>Math.round(v).toLocaleString('fr-FR')+' DH';
const cn=id=>(S.clients.find(c=>c.id==id)||{}).nom||'—',pn=id=>(S.projets.find(p=>p.id==id)||{}).nom||'—';
const cost=id=>S.depenses.filter(d=>d.projet==id).reduce((a,d)=>a+N(d.montant),0);
const paid=(k,id)=>S.paiements.filter(p=>p[k]==id&&p.statut=='Reçu').reduce((a,p)=>a+N(p.montant),0);
const due=id=>S.projets.filter(p=>p.client==id&&!['Prospect','Devis','Annulé'].includes(p.statut)).reduce((a,p)=>a+N(p.prix),0)-paid('client',id);
function render(){
 $('n').innerHTML=T.map(t=>`<button class="${t[0]==tab?'on':''}" data-t="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('');
 $('fab').style.display=tab=='home'?'none':'block';let h='';
 if(tab=='home'){const ca=S.paiements.filter(p=>p.statut=='Reçu').reduce((a,p)=>a+N(p.montant),0),dp=S.depenses.reduce((a,d)=>a+N(d.montant),0),cr=S.clients.reduce((a,c)=>a+Math.max(0,due(c.id)),0);
  const k=[['Chiffre d\'affaires',fm(ca)],['Dépenses',fm(dp)],['Bénéfice',fm(ca-dp)],['Marge',ca>0?((ca-dp)/ca*100).toFixed(1)+' %':'—'],['Créances clients',fm(cr)],['Clients',S.clients.length],['Projets en cours',S.projets.filter(p=>['Validé','En préparation','En production','Installation','Livraison'].includes(p.statut)).length],['Projets terminés',S.projets.filter(p=>p.statut=='Terminé').length]];
  h='<div class="g">'+k.map(x=>`<div class="k"><small>${x[0]}</small><div>${x[1]}</div></div>`).join('')+'</div>';
  const pr=S.paiements.filter(p=>p.statut=='Prévu');h+='<h2>Paiements prévus</h2>'+(pr.length?pr.map(p=>`<div class="r"><div><b>${esc(cn(p.client))}</b><small>${esc(pn(p.projet))}</small></div><b>${fm(N(p.montant))}</b></div>`).join(''):'<div class="em">Aucun paiement prévu</div>');
  if(!S.clients.length)h+='<div class="em">Commencez par ajouter un client (onglet Clients, bouton +). Les données restent sur ce téléphone.</div>';}
 else{const L=S[tab];h=L.length?L.slice().reverse().map(e=>row(e)).join(''):'<div class="em">Aucun élément — touchez + pour ajouter</div>';}
 $('v').innerHTML=h;}
function row(e){let a='',b='',c='';
 if(tab=='clients'){const r=due(e.id);a=esc(e.nom);b=esc((e.tel||'')+(e.ville?' • '+e.ville:''));c=(e.tel?`<a href="tel:${esc(e.tel)}">📞</a> <a href="https://wa.me/${esc(String(e.tel).replace(/\D/g,'').replace(/^0/,'212'))}">💬</a> `:'')+`<b class="${r>0?'ko':'ok'}">${r>0?fm(r):'Soldé'}</b>`}
 if(tab=='projets'){const co=cost(e.id),pf=N(e.prix)-co;a=esc(e.nom);b=esc(cn(e.client)+' • '+(e.statut||''))+`<div class="p"><i style="width:${Math.min(100,N(e.av))}%"></i></div><small>${N(e.av)}% • coût ${fm(co)}</small>`;c=`<b class="${pf>=0?'ok':'ko'}">${fm(pf)}</b>`}
 if(tab=='paiements'){a=esc(cn(e.client));b=esc(pn(e.projet)+' • '+(e.mode||''));c=`<b class="${e.statut=='Reçu'?'ok':'ko'}">${fm(N(e.montant))}</b><small>${esc(e.statut)}</small>`}
 if(tab=='depenses'){a=esc(e.cat+(e.desc?' — '+e.desc:''));b=esc(e.projet?pn(e.projet):'Charge générale');c=`<b>${fm(N(e.montant))}</b>`}
 return `<div class="r"><div><b>${a}</b><small>${b}</small></div><div style="text-align:right;flex:none">${c}</div><button class="x" data-d="${e.id}">✕</button></div>`}

 if(t.startsWith('opt:'))i=`<select name="${f[0]}">${O[t.slice(4)].map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
 else if(t.startsWith('sel:'))i=`<select name="${f[0]}"><option value="">—</option>${S[t.slice(4)].map(o=>`<option value="${o.id}">${esc(o.nom)}</option>`).join('')}</select>`;
 else i=`<input name="${f[0]}" type="${t}" ${t=='number'?'inputmode="decimal"':''}>`;return `<label>${f[1]}</label>${i}`}).join('')+'<button class="b">Enregistrer</button>';$('m').classList.add('on')}
